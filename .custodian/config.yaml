repo_key: RepoGraph
src_root: src
tests_root: tests

audit:
  reconcile_enforce: true

  cross_repo:
    platform_manifest_repo: ../PlatformManifest

  # registry.py IS the config layer: it resolves the per-machine registry
  # location from REPOGRAPH_REGISTRY / XDG_CONFIG_HOME. Reading those env
  # vars here is the legitimate single point of env access, not a leak.
  c13_allowed_paths:
    - "src/repograph/registry.py"

  exclude_paths:
    C32:
      # DisclosureMode.SECRET is a graph disclosure-mode enum value, not a credential.
      - "src/repograph/ontology/enums.py"
    D11:
      # topology/models.py relationship methods (upstream/downstream, from/to) and
      # diff.py visibility helpers are intentional symmetric APIs, not unintentional clones.
      - "src/repograph/topology/models.py"
      - "src/repograph/diff.py"
      # ontology/validation.py parse_plane/parse_owner_kind are parallel parsers for
      # distinct enum types; same body shape is expected.
      - "src/repograph/ontology/validation.py"
    T1:
      # Ontology, projection, schema, and topography symbols are the public API surface.
      # Tests exercise the integration layer; per-symbol unit coverage tracked separately.
      - "src/repograph/ontology/**"
      - "src/repograph/projection/**"
      - "src/repograph/schema/**"
      - "src/repograph/topography/**"
      - "src/repograph/topology/**"
      - "src/repograph/diff.py"
      # cli.py is a thin typer entrypoint: each manifest_* command is exercised
      # end-to-end via CliRunner in tests/test_cli.py, but T1 keys on the
      # symbol *name* and CliRunner invokes commands by their CLI string
      # ("manifest add") rather than the python function name.
      - "src/repograph/cli.py"
    T6:
      # Ontology, projection, topology, and schema modules are exercised through
      # integration tests (boundary artifact, schema governance) not by direct
      # name-import in unit test files.
      - "src/repograph/ontology/**"
      - "src/repograph/projection/**"
      - "src/repograph/schema/**"
      - "src/repograph/topography/**"
      - "src/repograph/topology/**"
      - "src/repograph/errors.py"
    T7:
      - "src/repograph/ontology/**"
      - "src/repograph/projection/**"
      - "src/repograph/schema/**"
      - "src/repograph/topography/**"
      - "src/repograph/topology/**"
      # T7 expects tests/unit/repograph/capabilities/test_*.py; this repo uses a
      # flat tests/ layout (no parallel-file tree exists for any subpackage).
      # T1/T6 are satisfied by genuine direct-import tests, not excluded.
      - "src/repograph/capabilities/**"
      - "src/repograph/diff.py"
      - "src/repograph/errors.py"

tools:
  ruff: true
  vulture: true

privacy:
  require_boundary_artifact: true
